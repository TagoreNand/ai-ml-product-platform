[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse360-product-intelligence"
version = "0.2.0"
description = "Senior-level AI/ML engineering platform for product intelligence (churn, recommendations, copilot, roadmap)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tagore Nand" }]
keywords = ["machine-learning", "mlops", "fastapi", "churn", "explainability", "product-intelligence"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
boost = ["xgboost>=2.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-requests",
]
all = ["shap>=0.45", "xgboost>=2.0"]

[project.urls]
Homepage = "https://github.com/TagoreNand/ai-ml-product-platform"
Repository = "https://github.com/TagoreNand/ai-ml-product-platform"

[project.scripts]
pulse360-train = "product_intelligence.pipelines.offline_training:main"
pulse360-score = "product_intelligence.pipelines.daily_batch_scoring:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["product_intelligence*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["product_intelligence"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PD"]
ignore = ["E501", "B008", "PD901"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
files = ["src"]
